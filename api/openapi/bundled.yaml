    pageSizeQuery:
      name: page-size
      in: query
      description: Page size in the query.
      required: true
      schema:
        type: integer
        minimum: 1
        maximum: 50
    captchaHeader:
      name: Frontend-Captcha-Token
      in: header
      description: Captcha token, required only for production environment.
      schema:
        type: string
    idStr:
      name: id
      description: String ID of the resource in path.
      in: path
      required: true
      schema:
        type: string
