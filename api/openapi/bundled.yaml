openapi: 3.1.0
info:
  title: Segoya backend REST API
  version: 0.4.0
  description: A REST API for Segoya panorama guessing game.
  contact:
    name: Telegram
    url: https://t.me/vasyss
  license:
    name: GNU AGPLv3
    url: https://www.gnu.org/licenses/agpl-3.0.en.html
servers:
  - url: https://segoya-api.vasys.su
    description: Production environment URL.
  - url: http://localhost:4174
    description: Local development environment URL.
security:
  - Bearer: []
tags:
  - name: play-areas
    description: Predefined areas, custom polygon counts, and saved areas.
  - name: auth
    description: Authentication and authorization.
  - name: general
    description: General operations, that do not fall into other categories.
  - name: lobbies
    description: Multiplayer lobby management.
  - name: multiplayer
    description: Multiplayer game operations.
  - name: singleplayer
    description: Singleplayer game operations.
  - name: users
    description: User profile management.
paths:
  /v1/play-areas/presets:
    get:
      operationId: getPlayAreaPresets
      summary: List provider-specific predefined areas
      tags:
        - play-areas
      x-ogen-operation-group: PlayAreas
      parameters:
        - name: provider
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/Provider'
      responses:
        '200':
          description: Predefined areas with exact location counts, without geometry.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlayAreaPreset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/play-areas/presets/{id}:
    get:
      operationId: getPlayAreaPreset
      summary: Get an immutable preset boundary and attribution
      tags:
        - play-areas
      x-ogen-operation-group: PlayAreas
      parameters:
        - $ref: '#/components/parameters/idUUID'
      responses:
        '200':
          description: Preset with simplified display geometry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayAreaPreset'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/play-areas/count:
    post:
      operationId: countPlayArea
      summary: Count stored locations in a play area
      description: Exact provider-specific count including the boundary; zero matches is a successful response. Maximum body size is 64 KiB; query deadline is three seconds.
      tags:
        - play-areas
      x-ogen-operation-group: PlayAreas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CountPlayAreaRequest'
      responses:
        '200':
          description: Count without candidate location coordinates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayAreaCount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/play-areas:
    get:
      operationId: getPlayAreas
      summary: List your saved custom areas
      tags:
        - play-areas
      x-ogen-operation-group: PlayAreas
      parameters:
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/pageSizeQuery'
      responses:
        '200':
          description: Saved areas belonging to the authenticated user.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPlayAreas'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: createPlayArea
      summary: Save a named custom polygon
      tags:
        - play-areas
      x-ogen-operation-group: PlayAreas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlayAreaRequest'
      responses:
        '201':
          description: Saved custom area, private unless explicitly shared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPlayArea'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/play-areas/{id}:
    parameters:
      - $ref: '#/components/parameters/idUUID'
    get:
      operationId: getPlayArea
      summary: Read your area or an unlisted area shared by ID
      tags:
        - play-areas
      x-ogen-operation-group: PlayAreas
      responses:
        '200':
          description: An accessible custom area.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPlayArea'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      operationId: updatePlayArea
      summary: Edit an area you own
      tags:
        - play-areas
      x-ogen-operation-group: PlayAreas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePlayAreaRequest'
      responses:
        '200':
          description: Updated saved area. Existing game/lobby snapshots are unaffected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedPlayArea'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
    delete:
      operationId: deletePlayArea
      summary: Delete an area you own
      tags:
        - play-areas
      x-ogen-operation-group: PlayAreas
      responses:
        '204':
          description: Deleted. Existing game/lobby snapshots are unaffected.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /:
    get:
      operationId: getRoot
      summary: Redirect to documentation
      description: Redirect to documentation page.
      security: []
      tags:
        - general
      responses:
        '302':
          description: Redirect to documentation page.
          headers:
            Location:
              description: Redirect location
              required: true
              schema:
                type: string
                example: https://segoya-api.vasys.su/docs
  /health:
    get:
      operationId: getHealth
      summary: Check API health
      description: Check API health status.
      security: []
      tags:
        - general
      responses:
        '200':
          description: API is operating normally.
          content:
            application/vnd.health+json:
              schema:
                type: object
                required:
                  - status
                properties:
                  status:
                    type: string
  /v1/users/me:
    get:
      operationId: getPrivateProfile
      summary: Get current user profile
      description: Retrieve authenticated user profile details.
      tags:
        - users
      x-ogen-operation-group: Users
      responses:
        '200':
          description: User profile details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPrivateProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
    patch:
      operationId: updateUser
      summary: Update user
      description: Update authenticated user's profile information.
      tags:
        - users
      x-ogen-operation-group: Users
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '204':
          description: Profile updated successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/users/{id}:
    get:
      operationId: getPublicProfile
      summary: Get user by ID
      description: Retrieve public user profile by ID.
      tags:
        - users
      x-ogen-operation-group: Users
      parameters:
        - $ref: '#/components/parameters/idUUID'
      responses:
        '200':
          description: User profile details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPublicProfile'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/users/avatar:
    put:
      operationId: updateUserAvatar
      summary: Update user avatar
      description: Upload a new avatar image (max 2MB).
      tags:
        - users
      x-ogen-operation-group: Users
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - avatarFile
              properties:
                avatarFile:
                  type: string
                  format: binary
                  maxLength: 2097152
                  description: Image file
      responses:
        '204':
          description: Avatar updated successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: File exceeds size limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/BackendError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/register:
    post:
      operationId: register
      summary: Register new user
      description: Register new user account.
      security: []
      tags:
        - auth
      x-ogen-operation-group: Auth
      parameters:
        - $ref: '#/components/parameters/captchaHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User created successfully.
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/login:
    post:
      operationId: login
      summary: Login user
      description: Log in using username and password.
      security: []
      tags:
        - auth
      x-ogen-operation-group: Auth
      parameters:
        - in: header
          name: User-Agent
          description: User agent is required to store sessions.
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/captchaHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '204':
          description: User logged in successfully.
          headers:
            Set-Cookie:
              required: true
              description: |
                HTTP-only, Secure cookies containing JWT tokens. accessToken: Short-lived session token refreshToken: Long-lived renewal token
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/tokens/refresh:
    post:
      operationId: refreshTokens
      summary: Get new refresh and access tokens
      description: Get new refresh and access tokens (Set-Cookie header).
      security: []
      tags:
        - auth
      x-ogen-operation-group: Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        '204':
          description: Tokens refreshed successfully.
          headers:
            Set-Cookie:
              required: true
              description: Access and refresh JWT tokens (accessToken, refreshToken)
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/sessions:
    get:
      operationId: getUserSessions
      summary: User sessions
      description: Get user sessions associated with the authenticated user.
      tags:
        - auth
      x-ogen-operation-group: Auth
      responses:
        '200':
          description: A list of user sessions.
          content:
            application/json:
              schema:
                type: array
                items:
                  allOf:
                    - $ref: '#/components/schemas/UserSession'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/sessions/{id}:
    delete:
      operationId: deleteUserSession
      summary: Delete user session
      description: Delete user session.
      tags:
        - auth
      x-ogen-operation-group: Auth
      parameters:
        - $ref: '#/components/parameters/idUUID'
      responses:
        '204':
          description: User session deleted successfully.
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/providers:
    get:
      operationId: getOAuthProviders
      summary: Get all connected OAuth providers
      description: Get all connected OAuth providers.
      tags:
        - auth
      x-ogen-operation-group: Auth
      responses:
        '200':
          description: A list of connected OAuth providers.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuthProvider'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/yandex/login:
    get:
      operationId: yandexLogin
      summary: Yandex login
      description: Log in using Yandex OAuth.
      security: []
      tags:
        - auth
      x-ogen-operation-group: Auth
      responses:
        '307':
          description: Redirect to Yandex OAuth page.
          headers:
            Location:
              required: true
              description: Yandex OAuth page URL
              schema:
                type: string
            Set-Cookie:
              required: true
              description: OAuth state cookie (oauthState)
              schema:
                type: string
  /v1/auth/yandex/login/callback:
    get:
      operationId: yandexLoginCallback
      summary: Yandex login callback
      description: A callback for Yandex OAuth login.
      security: []
      tags:
        - auth
      x-ogen-operation-group: Auth
      parameters:
        - in: header
          name: Cookie
          description: OAuth state cookie (oauthState).
          required: true
          schema:
            type: string
        - in: query
          name: code
          description: Yandex OAuth code from Yandex OAuth page.
          required: true
          schema:
            type: string
        - in: query
          name: state
          description: Yandex OAuth state (oauthState).
          required: true
          schema:
            type: string
      responses:
        '307':
          description: Redirect to Segoya login page.
          headers:
            Location:
              required: true
              description: Segoya login page URL
              schema:
                type: string
            Set-Cookie:
              required: true
              description: Access and refresh JWT tokens (accessToken, refreshToken)
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/yandex/new:
    get:
      operationId: newYandex
      summary: New Yandex auth
      description: Create Yandex OAuth connection.
      tags:
        - auth
      x-ogen-operation-group: Auth
      responses:
        '307':
          description: Redirect to Yandex OAuth page.
          headers:
            Location:
              required: true
              description: Yandex OAuth page URL
              schema:
                type: string
            Set-Cookie:
              required: true
              description: OAuth state cookie (oauthState)
              schema:
                type: string
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/yandex/new/callback:
    get:
      operationId: newYandexCallback
      summary: New Yandex auth callback
      description: A callback for new Yandex OAuth.
      security: []
      tags:
        - auth
      x-ogen-operation-group: Auth
      parameters:
        - in: header
          name: Cookie
          description: OAuth state cookie (oauthState).
          required: true
          schema:
            type: string
        - in: query
          name: code
          description: Yandex OAuth code from Yandex OAuth page.
          required: true
          schema:
            type: string
        - in: query
          name: state
          description: Yandex OAuth state (oauthState).
          required: true
          schema:
            type: string
      responses:
        '307':
          description: Redirect to Segoya profile page.
          headers:
            Location:
              required: true
              description: Segoya profile page URL
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/yandex:
    delete:
      operationId: deleteYandex
      summary: Delete Yandex auth
      description: Delete login with Yandex OAuth.
      tags:
        - auth
      x-ogen-operation-group: Auth
      responses:
        '204':
          description: Yandex OAuth deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/discord/login:
    get:
      operationId: discordLogin
      summary: Discord login
      description: Log in using Discord OAuth.
      security: []
      tags:
        - auth
      x-ogen-operation-group: Auth
      responses:
        '307':
          description: Redirect to Discord OAuth page.
          headers:
            Location:
              required: true
              description: Discord OAuth page URL
              schema:
                type: string
            Set-Cookie:
              required: true
              description: OAuth state cookie (oauthState)
              schema:
                type: string
  /v1/auth/discord/login/callback:
    get:
      operationId: discordLoginCallback
      summary: Discord login callback
      description: A callback for Discord OAuth login.
      security: []
      tags:
        - auth
      x-ogen-operation-group: Auth
      parameters:
        - in: header
          name: Cookie
          description: OAuth state cookie (oauthState).
          required: true
          schema:
            type: string
        - in: query
          name: code
          description: Discord OAuth code from Discord OAuth page.
          required: true
          schema:
            type: string
        - in: query
          name: state
          description: Discord OAuth state (oauthState).
          required: true
          schema:
            type: string
      responses:
        '307':
          description: Redirect to Segoya login page.
          headers:
            Location:
              required: true
              description: Segoya login page URL
              schema:
                type: string
            Set-Cookie:
              required: true
              description: Access and refresh JWT tokens (accessToken, refreshToken)
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/discord/new:
    get:
      operationId: newDiscord
      summary: New Discord auth
      description: Create Discord OAuth connection.
      tags:
        - auth
      x-ogen-operation-group: Auth
      responses:
        '307':
          description: Redirect to Discord OAuth page.
          headers:
            Location:
              required: true
              description: Discord OAuth page URL
              schema:
                type: string
            Set-Cookie:
              required: true
              description: OAuth state cookie (oauthState)
              schema:
                type: string
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/discord/new/callback:
    get:
      operationId: newDiscordCallback
      summary: Discord new auth callback
      description: A callback for new Discord OAuth.
      security: []
      tags:
        - auth
      x-ogen-operation-group: Auth
      parameters:
        - in: header
          name: Cookie
          description: OAuth state cookie (oauthState).
          required: true
          schema:
            type: string
        - in: query
          name: code
          description: Discord OAuth code from Discord OAuth page.
          required: true
          schema:
            type: string
        - in: query
          name: state
          description: Discord OAuth state (oauthState).
          required: true
          schema:
            type: string
      responses:
        '307':
          description: Redirect to Segoya profile page.
          headers:
            Location:
              required: true
              description: Segoya profile page URL
              schema:
                type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/auth/discord:
    delete:
      operationId: deleteDiscord
      summary: Delete Discord auth
      description: Delete login with Discord OAuth.
      tags:
        - auth
      x-ogen-operation-group: Auth
      responses:
        '204':
          description: Discord OAuth deleted successfully.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/lobbies:
    get:
      operationId: getLobbies
      summary: Get available lobbies
      description: Get all available lobbies.
      tags:
        - lobbies
      x-ogen-operation-group: Lobbies
      parameters:
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/pageSizeQuery'
      responses:
        '200':
          description: A list of available lobbies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbiesResponse'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      operationId: newLobby
      summary: Create new lobby
      description: Create new lobby with specified parameters.
      tags:
        - lobbies
      x-ogen-operation-group: Lobbies
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewLobby'
      responses:
        '201':
          description: Lobby created, lobby ID is returned.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                required:
                  - id
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/lobbies/{id}:
    get:
      operationId: getLobby
      summary: Get lobby by ID
      description: Get lobby information by ID.
      tags:
        - lobbies
      x-ogen-operation-group: Lobbies
      parameters:
        - $ref: '#/components/parameters/idStr'
      responses:
        '200':
          description: Lobby information fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lobby'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/ServerError'
  /v1/singleplayer:
    get:
      operationId: getSingleplayerGames
      summary: Get all singleplayer user games
      description: Get all singleplayer user games.
      tags:
        - singleplayer
      x-ogen-operation-group: Singleplayer
      parameters:
        - $ref: '#/components/parameters/pageQuery'
        - $ref: '#/components/parameters/pageSizeQuery'
      responses:
        '200':
          description: List of singleplayer user games fetched successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SingleplayerGames'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
