        creatorID:
          type: string
          format: uuid
        maxPlayers:
          type: integer
          minimum: 2
          maximum: 10
        rounds:
          type: integer
          minimum: 1
          maximum: 10
        playArea:
          $ref: '#/components/schemas/PlayAreaSelection'
        provider:
          $ref: '#/components/schemas/Provider'
        timerSeconds:
          type: integer
          description: Zero or omitted disables the timer; otherwise 10-600 seconds.
          minimum: 0
          maximum: 600
          allOf:
            - not:
                type: integer
                minimum: 1
                maximum: 9
        movementAllowed:
          type: boolean
        private:
          type: boolean
      required:
        - creatorID
        - maxPlayers
        - rounds
        - provider
        - movementAllowed
        - private
    SingleplayerGame:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userID:
          type: string
          format: uuid
        rounds:
          type: integer
        roundCurrent:
          type: integer
        timerSeconds:
          type: integer
        movementAllowed:
          type: boolean
        playArea:
          $ref: '#/components/schemas/PlayAreaSelection'
        provider:
