        - lastActive
    AuthProvider:
      type: object
      properties:
        provider:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - provider
        - createdAt
    Lobby:
      type: object
      properties:
        id:
          type: string
        creatorID:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        rounds:
          type: integer
        playArea:
          $ref: '#/components/schemas/PlayAreaSelection'
        provider:
          $ref: '#/components/schemas/Provider'
        movementAllowed:
          type: boolean
        timerSeconds:
          type: integer
        currentPlayers:
          type: integer
