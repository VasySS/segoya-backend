get:
  operationId: getSingleplayerGameGuesses
  summary: Get singleplayer game guesses
  description: Get a list of all guesses made during a singleplayer game.
  tags: ["singleplayer"]
  x-ogen-operation-group: Singleplayer
  parameters:
    - $ref: "../../components/parameters.yaml#/idUUID"
  responses:
    "200":
      description: List of singleplayer game rounds.
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: "../../components/schemas/singleplayer.yaml#/SingleplayerGuess"
    "400":
      $ref: "../../components/responses.yaml#/BadRequest"
    "401":
      $ref: "../../components/responses.yaml#/Unauthorized"
    "403":
      $ref: "../../components/responses.yaml#/Forbidden"
    "404":
      description: Singleplayer game not found
      $ref: "../../components/responses.yaml#/NotFound"
    "500":
      $ref: "../../components/responses.yaml#/ServerError"
