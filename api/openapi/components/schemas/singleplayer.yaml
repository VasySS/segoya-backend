NewSingleplayerGameRequest:
  type: object
  properties:
    rounds:
      type: integer
      minimum: 1
      maximum: 10
    timerSeconds:
      type: integer
      description: Zero or omitted disables the timer; otherwise 10-600 seconds.
      minimum: 0
      maximum: 600
      not:
        minimum: 1
        maximum: 9
    movementAllowed:
      type: boolean
    provider:
      $ref: "panorama.yaml#/Provider"
  required: [rounds, movementAllowed, provider]

SingleplayerGame:
  type: object
  properties:
    id:
      type: string
      format: uuid
    userID:
      type: string
      format: uuid
    rounds:
      type: integer
    roundCurrent:
      type: integer
    timerSeconds:
      type: integer
    movementAllowed:
      type: boolean
    provider:
      $ref: "panorama.yaml#/Provider"
    score:
      type: integer
    finished:
      type: boolean
    createdAt:
      type: string
      format: date-time
  required:
    [
      id,
      userID,
      rounds,
      roundCurrent,
      timerSeconds,
      movementAllowed,
      provider,
      score,
      finished,
      createdAt,
    ]

SingleplayerGames:
  type: object
  properties:
    total:
      type: integer
    games:
      type: array
      items:
        $ref: "#/SingleplayerGame"
  required: [total, games]

SingleplayerRound:
  type: object
  properties:
    id:
      type: string
      format: uuid
    gameID:
      type: string
      format: uuid
    streetviewID:
      type: string
    roundNum:
      type: integer
    lat:
      type: number
    lng:
      type: number
    finished:
      type: boolean
    createdAt:
      type: string
      format: date-time
    startedAt:
      type: string
      format: date-time
    endedAt:
      type: string
      format: date-time
  required:
    [
      id,
      gameID,
      streetviewID,
      roundNum,
      lat,
      lng,
      finished,
      createdAt,
      startedAt,
      endedAt,
    ]

SingleplayerRoundGuess:
  type: object
  properties:
    guess:
      oneOf:
        - $ref: "panorama.yaml#/LatLng"
        - type: "null"
  required: [guess]

SingleplayerGuess:
  type: object
  properties:
    roundNum:
      type: integer
    roundLat:
      type: number
    roundLng:
      type: number
    guessLat:
      type: number
    guessLng:
      type: number
    score:
      type: integer
    missDistance:
      type: integer
  required:
    [roundNum, roundLat, roundLng, guessLat, guessLng, score, missDistance]

EndSingleplayerRoundResponse:
  type: object
  properties:
    score:
      type: integer
    distance:
      type: integer
  required: [score, distance]
